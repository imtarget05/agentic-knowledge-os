[tool.poetry]
name = "agentic-knowledge-os"
version = "0.1.0"
description = "MCP-powered Multi-Agent RAG Platform"
authors = ["AI Engineer"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = "^0.28.0"
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"
langgraph = "^0.0.30"
llama-index = "^0.10.20"
llama-index-embeddings-openai = "^0.1.6"
llama-index-embeddings-gemini = "^0.1.3"
llama-index-embeddings-huggingface = "^0.2.0"
qdrant-client = "^1.8.0"
rank-bm25 = "^0.2.2"
mcp = "^1.1.2"
python-multipart = "^0.0.9"
pypdf = "^4.1.0"
docx2txt = "^0.8"
sqlite3-binary = { version = "*", optional = true }
langfuse = "^2.21.0"
sentence-transformers = "^2.6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
